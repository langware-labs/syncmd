name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-cli:
    name: build-cli (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: syncmd-x86_64-unknown-linux-gnu.tar.gz
            binary: syncmd
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            archive: syncmd-aarch64-unknown-linux-gnu.tar.gz
            binary: syncmd
          - os: macos-13
            target: x86_64-apple-darwin
            archive: syncmd-x86_64-apple-darwin.tar.gz
            binary: syncmd
          - os: macos-14
            target: aarch64-apple-darwin
            archive: syncmd-aarch64-apple-darwin.tar.gz
            binary: syncmd
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            archive: syncmd-x86_64-pc-windows-msvc.tar.gz
            binary: syncmd.exe

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --package syncmd --target ${{ matrix.target }}

      - name: Package archive (unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} .
          tar -czf ${{ matrix.archive }} ${{ matrix.binary }}

      - name: Package archive (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "${{ matrix.binary }}"
          tar -czf "${{ matrix.archive }}" "${{ matrix.binary }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.archive }}

  github-release:
    name: attach-release-assets
    needs: build-cli
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Collect archives
        run: |
          mkdir -p release
          find dist -type f -name 'syncmd-*.tar.gz' -exec cp {} release/ \;

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*

  publish-crates:
    name: publish-crates
    needs: github-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish syncmd-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --package syncmd-core

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish syncmd
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --package syncmd

  build-wheels:
    name: build-wheels (${{ matrix.os }} / ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64
          - os: ubuntu-22.04-arm
            target: aarch64
          - os: macos-13
            target: x86_64
          - os: macos-14
            target: aarch64
          - os: windows-2022
            target: x64

    steps:
      - uses: actions/checkout@v4

      - uses: PyO3/maturin-action@v1
        with:
          command: build
          manylinux: auto
          target: ${{ matrix.target }}
          args: --release --manifest-path crates/syncmd-py/Cargo.toml --interpreter 3.9 3.10 3.11 3.12 3.13 --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*

  publish-pypi:
    name: publish-pypi
    needs: build-wheels
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: wheelhouse
          pattern: wheels-*
          merge-multiple: true

      - uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          working-directory: .
          args: wheelhouse/*

  publish-npm:
    name: publish-npm
    needs: github-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install npm package dependencies
        working-directory: npm/syncmd
        run: npm install --ignore-scripts

      - name: Publish syncmd npm package
        working-directory: npm/syncmd
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
